services:
  chat:
    build:
      context: ..
      dockerfile: broker/Dockerfile
    init: true
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - chat-data:/data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  chat-data:
