[package]
name = "tonalli-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.96.1"
build = "build.rs"

[workspace]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[features]
mesh = ["shell", "tonalli-core/mesh"]
default = ["shell"]
ai = ["shell", "tonalli-core/ai"]
shell = ["dep:tonalli-core", "dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "dep:serde_json", "dep:serde", "dep:tempfile", "dep:reqwest", "dep:windows-sys"]

[dependencies]
url = "=2.5.8"
tonalli-core = { path = "../crates/core", optional = true }
tauri = { version = "=2.12.3", optional = true, features = ["tray-icon"] }
tauri-plugin-dialog = { version = "=2.8.2", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
tempfile = { version = "=3.23.0", optional = true }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_Dns", "Win32_Networking_WinSock"], optional = true }

[patch.crates-io]
reqwest = { path = "../crates/reqwest-fork" }
hyper-util = { path = "../crates/hyper-util-fork" }

[build-dependencies]
tauri-build = { version = "=2.7.2", optional = true }
serde_json = { version = "=1.0.154", optional = true }

[dev-dependencies]
tempfile = "=3.23.0"

[[bin]]
name = "tonalli-desktop"
path = "src/main.rs"
required-features = ["shell"]
