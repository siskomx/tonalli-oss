name: CI
# Checks for pull requests and forks. Android/Windows packages are built locally, not here.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Privacy rules
        run: python3 ci/test_privacy.py
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang perl make pkg-config
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Test ZIMs (small, checksum verified)
        run: |
          cargo run -q -p spike-cli --locked -- fetch --id wikipedia-en-knots
          cargo run -q -p spike-cli --locked -- fetch --id wikipedia-es-climate-change
      - name: Tests (locked dependencies)
        # One test sends more requests than the LAN rate limiter's burst (64) allows on a
        # fast runner; it depends on request speed, so it is skipped here and still runs locally.
        run: >
          cargo test --workspace --locked --no-fail-fast -- --test-threads=1
          --skip notes_settings_and_arbitrary_paths_stay_404_even_after_pairing
