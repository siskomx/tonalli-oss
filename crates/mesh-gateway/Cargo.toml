[package]
name = "tonalli-mesh-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
serial = ["dep:meshtastic", "dep:tokio", "dep:tokio-util", "dep:serde", "dep:toml", "dep:thiserror", "dep:fs2", "dep:sha2"]
ble = ["serial", "meshtastic/bluetooth-le", "meshtastic/serde", "dep:btleplug"]
android-ble = ["ble", "dep:jni"]

[dependencies]
btleplug = { version = "=0.12.0", optional = true }
meshtastic = { path = "../meshtastic-fork", version = "=0.1.9", default-features = false, features = ["tokio"], optional = true }
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "signal"], optional = true }
tokio-util = { version = "=0.7.20", features = ["rt"], optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
toml = { version = "=1.2.1+spec-1.1.0", optional = true }
thiserror = { version = "=2.0.21", optional = true }
fs2 = { version = "=0.4.3", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.19.0", optional = true }

[[bin]]
name = "tonalli-mesh-spike"
path = "src/main.rs"
required-features = ["serial"]
