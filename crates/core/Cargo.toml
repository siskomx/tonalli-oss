[package]
name = "tonalli-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tonalli-mesh-gateway = { path = "../mesh-gateway", optional = true, features = ["ble"] }
tonalli-chat-store = { path = "../chat-store" }
llama-cpp-2 = { path = "../llama-cpp-2-fork", version = "=0.1.161", optional = true, default-features = false, features = ["android-static-stdcxx"] }
uniffi = { version = "=0.32.2", optional = true, default-features = false }
libmkiso = { path = "../libmkiso-fork", version = "=0.1.5", default-features = false }
libloading = "=0.8.9"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
pmtiles-reader = { package = "pmtiles", path = "../pmtiles-fork", version = "=0.28.0", default-features = false }
percent-encoding = "=2.3.2"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["io", "rt"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
mdns-sd = { version = "=0.21.7", default-features = false }
socket2 = "=0.6.5"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
subtle = "=2.6.1"
zeroize = "=1.9.1"
html5ever = "=0.39.0"
rayon = "=1.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
zim-reader = { package = "zim", path = "../zim-fork", version = "=0.5.0" }
unicode-normalization = "=0.1.26"
tempfile = "=3.23.0"

memmap2 = "=0.9.12"
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "=0.10.9"
ring = "=0.17.14"
url = "=2.5.8"
fs2 = "=0.4.3"
toml = "=1.2.1+spec-1.1.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
tantivy = "=0.27.0"
thiserror = "=2.0.21"
xz2 = { version = "=0.1.7", features = ["static"] }
zstd = "=0.14.3"
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "=0.42.0", features = ["encoding"] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["test-util"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "=3.23.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.19.0", optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["test-util"] }

[features]
mesh = ["dep:tonalli-mesh-gateway"]
mesh-android = ["mesh", "tonalli-mesh-gateway/android-ble", "dep:jni"]
ai = ["dep:llama-cpp-2"]
ffi = ["dep:uniffi"]
bindgen = ["ffi", "uniffi/cli"]
test-routes = []

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bench]]
name = "zim_title"
harness = false

[[example]]
name = "notes-browser-fixture"
path = "examples/notes-browser-fixture.rs"
required-features = ["test-routes"]
