[package]
name = "tonalli-ios"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.96.1"
build = "build.rs"

[workspace]
resolver = "2"

[lib]
name = "tonalli_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# On-device AI (llama.cpp, CPU only). The shared desktop session code is already gated on this name.
ai = ["tonalli-core/ai"]
# Meshtastic radio over Bluetooth (CoreBluetooth through btleplug); the iPhone UI never offers USB.
mesh = ["tonalli-core/mesh"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[dependencies]
tonalli-core = { path = "../crates/core" }
tauri = { version = "=2.12.3" }
tauri-plugin-dialog = { version = "=2.8.2" }
url = "=2.5.8"
if-addrs = "=0.15.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.23.0"
sha2 = "=0.10.9"
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2"] }

[patch.crates-io]
reqwest = { path = "../crates/reqwest-fork" }
hyper-util = { path = "../crates/hyper-util-fork" }

[build-dependencies]
tauri-build = "=2.7.2"
